[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "amoxpohualistli"
version = "0.1.0"
description = "RSVP speed reader — desktop application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pywebview>=6.0,<7.0",
    "PyMuPDF>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<6.0",
    "striprtf>=0.0.6",
]

[project.scripts]
amoxpohualistli = "main:AmoxpohualistliApp.run"

[tool.setuptools.packages.find]
include = ["main", "parser", "settings"]
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
